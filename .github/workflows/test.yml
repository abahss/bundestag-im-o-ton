name: test

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - run: uv run pytest
        env:
          # practicepreach.params validates these at import time; the tests
          # themselves hit no real APIs. GCS_CHROMA_PATH just selects the
          # branch that skips the PERSIST_DIR/DATA_CSV checks.
          GOOGLE_API_KEY: test
          GCS_CHROMA_PATH: gs://test/chroma
